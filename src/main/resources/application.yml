spring:
  application:
    name: data-change-governance
  datasource:
    url: jdbc:h2:mem:governance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  error:
    include-message: always
  port: 8080
governance:
  integrations:
    endpoints:
      openmetadata: { enabled: false, base-url: "", credential-ref: "" }
      openlineage: { enabled: false, base-url: "", credential-ref: "" }
      temporal: { enabled: false, base-url: "", credential-ref: "" }
      kafka: { enabled: false, base-url: "", credential-ref: "" }
      flink: { enabled: false, base-url: "", credential-ref: "" }
      vault: { enabled: false, base-url: "", credential-ref: "" }
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/change_governance}
    username: ${DB_USERNAME:change_governance}
    password: ${DB_PASSWORD:change_governance}
  jpa:
    hibernate:
      ddl-auto: validate
